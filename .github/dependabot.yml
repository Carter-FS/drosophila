version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Security updates only; no routine version-bump PRs
    open-pull-requests-limit: 0
    ignore:
      # brian2 2.5.1 imports pkg_resources, which setuptools 81+ removed
      - dependency-name: "setuptools"
        versions: [">=81"]
